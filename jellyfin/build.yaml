changelog: >
  0.4: the Sesn key is kept in a private credentials file instead of the plugin
  settings; progress is sent at most every 90 seconds per stream; delivery stops
  after Sesn rejects the key until the server is paired again; disconnect treats
  an already-revoked key as done and backs off instead of retrying forever; only
  https Sesn addresses (or http to localhost) are accepted.
